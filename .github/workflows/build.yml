name: Build arcX Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and upload image
    runs-on: ubuntu-latest

    container:
      image: cachyos/cachyos-v3:latest
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm \
            jq \
            git \
            cpio \
            mkosi \
            paru \
            systemd \
            systemd-ukify \
            erofs-utils \
            btrfs-progs \
            dosfstools \
            mtools \
            squashfs-tools \
            qemu-headless-arch-extra \
            edk2-ovmf

      - name: Prepare repos for mkosi
        run: |
          pacman-key --init
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB

          pacman -U --noconfirm \
            "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst" \
            "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst"

      - name: Build arcX
        run: |
          mkosi --image-version=$(date +%Y.%m.%d) build --output-dir mkosi.output

      - name: List output
        run: ls -lh mkosi.output

      - name: Boot test arcX image
        run: |
          FILE=$(ls -t mkosi.output/arcX_*.raw | head -n1)
          OVMF=$(find /usr/share/edk2 -name 'OVMF*.fd' -o -name 'OVMF_CODE*.fd' | head -n1)

          echo "Image: $FILE"
          echo "UEFI firmware: $OVMF"

          timeout 120 qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF" \
            -drive format=raw,file="$FILE" \
            -m 2G \
            -smp 2 \
            -nographic \
            -serial mon:stdio \
            -no-reboot \
            2>&1 | tee boot-test.log || true

          echo ""
          echo "=== Boot test log summary ==="
          grep -iE "(error|fail|unknown symbol)" boot-test.log || echo "No errors found"

          CRITICAL=0
          if grep -q "i2c_hid_acpi.*Unknown symbol" boot-test.log; then
            echo "::error::i2c_hid_acpi module failed to load (missing i2c-hid dependency)"
            CRITICAL=$((CRITICAL + 1))
          fi
          if grep -q "kernel panic" boot-test.log; then
            echo "::error::Kernel panic detected"
            CRITICAL=$((CRITICAL + 1))
          fi

          echo "Critical errors: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Boot test failed with $CRITICAL critical errors"
            exit 1
          fi

      - name: Upload to Gofile
        run: |
          FILE=$(ls -t mkosi.output/arcX_*.raw | head -n1)

          curl --fail \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 0 \
              -F "file=@$FILE" \
              https://upload.gofile.io/uploadfile \
              -o response.json
          echo "Response:"
          cat response.json

          echo "Download link:"
          jq -r '.data.downloadPage // .data.file.url.full' response.json || true
